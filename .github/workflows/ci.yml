name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Linting and code quality
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run compile

  # Security checks
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't fail on vulnerabilities, just report

      - name: Check for console.log in source
        run: |
          if grep -r "console\.log" src/ --include="*.ts" | grep -v "test" | grep -v "\.test\."; then
            echo "::warning::Found console.log in source files (use outputChannel instead)"
          fi

  # Build and package
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npx vsce package --allow-missing-repository

      - name: Check VSIX size
        run: |
          SIZE=$(stat -c%s *.vsix)
          echo "VSIX size: $SIZE bytes"
          if [ "$SIZE" -gt 5242880 ]; then
            echo "::error::VSIX too large: $SIZE bytes (max 5MB recommended)"
            exit 1
          fi
          echo "✅ VSIX size is within limits"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gixy-vsix
          path: '*.vsix'

  # Test on multiple platforms
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      # Note: VSCode extension tests require a display
      # In CI, we skip integration tests that need VSCode runtime
      - name: Run unit tests (non-VSCode)
        run: |
          echo "Unit tests would run here"
          # npm test -- --grep "unit"

  # Validate package.json manifest
  validate-manifest:
    name: Validate Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const required = ['name', 'displayName', 'description', 'version', 'publisher', 'engines', 'main'];
            const missing = required.filter(k => !pkg[k]);
            if (missing.length) {
              console.error('Missing required fields:', missing);
              process.exit(1);
            }
            console.log('✅ package.json is valid');
          "

      - name: Check version format
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not valid semver"
            exit 1
          fi
          echo "✅ Version $VERSION is valid semver"

      - name: Check publisher
        run: |
          PUBLISHER=$(node -p "require('./package.json').publisher")
          if [ -z "$PUBLISHER" ]; then
            echo "::error::Publisher is not set in package.json"
            exit 1
          fi
          echo "✅ Publisher: $PUBLISHER"

  # Check for common issues
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for TODO/FIXME comments
        run: |
          count=$(grep -rn "TODO\|FIXME\|XXX\|HACK" src/ --include="*.ts" | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "::warning::Found $count TODO/FIXME comments:"
            grep -rn "TODO\|FIXME\|XXX\|HACK" src/ --include="*.ts" || true
          fi

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "password\|secret\|api_key\|apikey" src/ --include="*.ts" -i | grep -v "test"; then
            echo "::warning::Potential hardcoded secrets found"
          fi

      - name: Validate JSON files
        run: |
          for f in package.json tsconfig.json language-configuration.json; do
            if [ -f "$f" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$f'))" && echo "✅ $f is valid JSON"
            fi
          done
