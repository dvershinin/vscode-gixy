# Test NGINX configuration with multiple security issues
# This file is used for testing the Gixy VSCode extension

# Issue: worker_rlimit_nofile_vs_connections
events {
    worker_connections 1024;
}

http {
    # Issue: version_disclosure - server_tokens should be off
    server_tokens on;

    server {
        listen 80;
        server_name vulnerable.example.com;

        # Issue: missing default_server flag (if multiple servers on same port)
        
        # Issue: error_log_off
        # error_log off;

        # Issue: add_header_redefinition - this will override parent headers
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

        # Issue: SSRF - user controlled proxy_pass
        location /proxy/ {
            set $backend $arg_backend;
            proxy_pass http://$backend;  # CRITICAL: SSRF vulnerability!
        }

        # Issue: host_spoofing - using $http_host instead of $host
        location /api/ {
            proxy_set_header Host $http_host;
            proxy_pass http://backend:8080;
        }

        # Issue: http_splitting - $uri can contain newlines
        location /redirect {
            return 301 http://$host$uri;
        }

        # Issue: alias_traversal - location doesn't end with /
        location /files {
            alias /var/www/files/;
        }

        # Issue: add_header_content_type - should use default_type
        location /text {
            add_header Content-Type text/plain;
            return 200 "Hello World";
        }

        # Issue: valid_referers with none
        location /secure {
            valid_referers none server_names *.example.com;
            if ($invalid_referer) {
                return 403;
            }
        }

        # Issue: allow_without_deny
        location /admin {
            allow 192.168.1.0/24;
            allow 10.0.0.0/8;
            # Missing: deny all;
        }

        # Issue: origins - regex allows unintended origins
        location /cors {
            if ($http_origin ~* "^https?://.*\.example.com") {
                add_header Access-Control-Allow-Origin $http_origin;
            }
        }

        # Issue: if_is_evil - using if in location context
        location /dangerous {
            if ($request_method = POST) {
                set $is_post 1;  # Not safe in if context
            }
        }

        # Issue: try_files without open_file_cache
        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # Issue: hash_without_default
        # map $uri $new_uri {
        #     ~^/old/(.*)$ /new/$1;
        #     # Missing: default "";
        # }

        # Issue: unanchored_regex - performance issue
        location ~ proxy {
            proxy_pass http://backend;
        }

        # Issue: invalid_regex - referencing non-existent capture group
        location /rewrite {
            rewrite ^/path$ $1 redirect;  # $1 doesn't exist
        }
    }

    # Another server block to test add_header_redefinition
    server {
        listen 80;
        server_name other.example.com;

        add_header X-Frame-Options DENY;

        location / {
            # This add_header will DROP the parent X-Frame-Options!
            add_header Cache-Control "no-cache";
            root /var/www/html;
        }
    }

    # Issue: resolver_external - using external DNS
    server {
        listen 80;
        server_name dns.example.com;

        resolver 8.8.8.8;  # Using Google's public DNS

        location / {
            proxy_pass http://backend;
        }
    }

    # Upstream with static DNS that needs resolver
    upstream dynamic_backend {
        server backend.internal.example.com;  # Needs resolver for DNS
    }
}






